services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: psihointegritet
      POSTGRES_USER: psihointegritet
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psihointegritet -d psihointegritet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8-alpine
    ports:
      - "6381:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    profiles: ["backend"]
    # No `env_file`. It existed only to hand the container the public Clerk
    # verifier values, and Clerk is gone (D-083, AUTH-6). Every variable the
    # backend needs is named below, so a stale `.env.compose.local` can no
    # longer quietly override `DATABASE_URL` and point local dev at production.
    environment:
      ENVIRONMENT: development
      # Which tenant this local backend serves (C2(a): one runtime, one
      # organization). Override it to look at another tenant locally:
      #   DEFAULT_ORGANIZATION_SLUG=sanja-neuer docker compose up -d backend
      # The frontend has its own copy in frontend/.env.local and the two must
      # agree, or the panel resolves one tenant while the API answers for another.
      DEFAULT_ORGANIZATION_SLUG: ${DEFAULT_ORGANIZATION_SLUG:-psihointegritet}
      DATABASE_URL: postgresql+asyncpg://psihointegritet:local_only_change_me@postgres:5432/psihointegritet
      MIGRATION_DATABASE_URL: postgresql+psycopg://psihointegritet:local_only_change_me@postgres:5432/psihointegritet
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:3007"]'
      # Where a link in an email points. Without it the backend falls back to
      # the production origin, so a local registration would mail a link that
      # opens production and spends its token on the wrong deployment.
      EMAIL_BASE_URL: ${EMAIL_BASE_URL:-http://localhost:3007}
      # Empty by default, which is the correct local state: the mailer reports
      # itself unconfigured and every send is skipped with a warning. Export a
      # real key only to test delivery — every address in the local database is
      # a real mailbox somewhere.
      #
      # The link is deliberately NOT logged when there is no mailer. Whoever
      # reads the log would hold the account, and a one-time link is a
      # credential wherever it is written down. `scripts/platform_accounts.py
      # --reset` is how you get one locally.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
